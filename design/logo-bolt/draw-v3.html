<style>

  button { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--line);

// Центр линии знака (как в bolt-line.svg). Порядок обхода — как в наброске владельца.
const START = [129.7, 57.3];          // середина верхней диагонали
const PTS = [
  START,
  [76.3, 171],   // ступенька
  [150, 171],    // правый край короткой перекладины
  [76.5, 316.5], // нижнее остриё
  [6.5, 131],    // левый угол длинной перекладины
  [208, 131],    // правый угол
  [152.6, 8.6],  // вершина
  START,
];
const D = 'M' + PTS.map(p => p.join(' ')).join(' L');
const SEG = PTS.slice(1).map((p, i) => Math.hypot(p[0] - PTS[i][0], p[1] - PTS[i][1]));
const CUM = SEG.reduce((a, s) => (a.push(a.at(-1) + s), a), [0]);
const L = CUM.at(-1);
const CORNERS = CUM.slice(1, -1);
const BAR_LEN = 200 - 14.5;     // углы, где сварщик притормаживает

const MODES = {
  long: { dur: 5600, ignite: 260, sparks: true,  corner: 1.4, finish: 900 },
  fast: { dur: 1150, ignite: 0,   sparks: false, corner: 0.35, finish: 500 },
};

// Профиль хода: время по длине пути. Медленнее у углов, плавный разгон и торможение по краям.
function buildProfile(corner) {
  const N = 800, r = 9;
  const s = [], t = [0];
  for (let i = 0; i <= N; i++) s.push(L * i / N);
  for (let i = 1; i <= N; i++) {
    const m = (s[i] + s[i - 1]) / 2;
    let w = 1;
    for (const c of CORNERS) w += corner * Math.exp(-(((m - c) / r) ** 2));
    const edge = Math.min(m, L - m);
    w += 1.6 * Math.exp(-edge / 8);           // мягкий старт и финиш
    t.push(t[i - 1] + w);
  }
  const T = t[N];
  return u => {                              // u: 0..1 времени → длина пути
    const target = u * T;
    let lo = 0, hi = N;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; (t[mid] < target ? lo = mid : hi = mid); }
    const k = (target - t[lo]) / ((t[hi] - t[lo]) || 1);
    return s[lo] + k * (s[hi] - s[lo]);
  };
}
const PROFILES = { long: buildProfile(MODES.long.corner), fast: buildProfile(MODES.fast.corner) };
const easeInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeOut = u => 1 - Math.pow(1 - u, 3);

const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let uid = 0;

function makeMark(host) {
  const id = 'm' + (++uid);
  const size = host.dataset.size;
  host.innerHTML = `
  <svg class="mark" viewBox="0 0 215 326" aria-label="Знак Эмилиус">
    <defs>
      <mask id="${id}r" maskUnits="userSpaceOnUse" x="-20" y="-20" width="255" height="366">
        <path class="mp" d="${D}" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- перекладина закрыта, пока до неё не дошёл шов; диагональ на перекрестии открывается узкой линией -->
        <path class="bar" d="M14.5 131 L200 131" fill="none" stroke="#000" stroke-width="14"/>
        <path class="diag" d="M129.7 57.3 L76.3 171" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="butt"/>
      </mask>
      <filter id="${id}g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="${id}t" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <filter id="${id}s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      <radialGradient id="${id}f">
        <stop offset="0" stop-color="#fff"/>
        <stop offset=".28" stop-color="#fff3c8"/>
        <stop offset=".6" stop-color="#ffb14a" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="sheen" opacity="0" filter="url(#${id}s)">${MARK}</g>
    <g mask="url(#${id}r)">${MARK}</g>
    <g class="tail" opacity="0" filter="url(#${id}t)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path class="t3" d="${D}" stroke="#ff8a2a" stroke-width="8" opacity=".35"/>
      <path class="t2" d="${D}" stroke="#ffd27a" stroke-width="6.5" opacity=".85"/>
      <path class="t1" d="${D}" stroke="#fffdf4" stroke-width="5"/>
    </g>
    <g class="sparks"></g>
    <g class="torch" opacity="0">
      <circle class="halo" r="16" fill="url(#${id}f)" filter="url(#${id}g)"/>
      <circle r="4.2" fill="#fff" stroke="#ffae42" stroke-width="1" stroke-opacity=".7"/>
    </g>
  </svg>`;
  const q = s => host.querySelector(s);
  const m = {
    size, mp: q('.mp'), tail: q('.tail'), t1: q('.t1'), t2: q('.t2'), t3: q('.t3'),
    sparksG: q('.sparks'), torch: q('.torch'), halo: q('.halo'), sheen: q('.sheen'),
    sparks: [], lastSpark: 0, corner: 0, bar: q('.bar'), diag: q('.diag'),
  };
  m.mp.style.strokeDasharray = `${L} ${L}`;
  return m;
}

const marks = [...document.querySelectorAll('[data-mark]')].map(makeMark);
let mode = 'long', speed = 1, raf = 0;

// плавное «дрожание» пламени вместо случайного скачка каждый кадр
const flick = t => .86 + .14 * (Math.sin(t * .031) * .5 + Math.sin(t * .077 + 1) * .3 + Math.sin(t * .013 + 2) * .2);

function spark(m, x, y, dirx, diry, elapsed, power = 1) {
  const back = Math.atan2(-diry, -dirx);
  const ang = back + (Math.random() - .5) * 2.4;
  const sp = (45 + Math.random() * 110) * power;
  const el = document.createElementNS(NS, 'line');
  el.setAttribute('stroke', Math.random() < .45 ? '#fffbe8' : (Math.random() < .6 ? '#ffd27a' : '#ff9a3c'));
  el.setAttribute('stroke-width', (0.8 + Math.random() * .8).toFixed(2));
  el.setAttribute('stroke-linecap', 'round');
  m.sparksG.appendChild(el);
  m.sparks.push({ el, x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20, born: elapsed, life: 240 + Math.random() * 380 });
}

function stepSparks(m, elapsed, dt) {
  m.sparks = m.sparks.filter(s => {
    const age = elapsed - s.born;
    if (age > s.life) { s.el.remove(); return false; }
    s.vy += 300 * dt; s.vx *= .985;
    s.x += s.vx * dt; s.y += s.vy * dt;
    const k = .04;
    s.el.setAttribute('x1', s.x.toFixed(2)); s.el.setAttribute('y1', s.y.toFixed(2));
    s.el.setAttribute('x2', (s.x - s.vx * k).toFixed(2)); s.el.setAttribute('y2', (s.y - s.vy * k).toFixed(2));
    s.el.setAttribute('opacity', (1 - age / s.life).toFixed(2));
    return true;
  });
}

function tailWindow(path, len, size) {
  const tl = Math.min(size, len);
  path.style.strokeDasharray = `0 ${len - tl} ${tl} ${L + 10}`;
}

function render(m, cfg, elapsed, dt) {
  const prof = PROFILES[mode];
  const tDraw = elapsed - cfg.ignite;
  const u = Math.max(0, Math.min(1, tDraw / cfg.dur));
  const len = mode === 'long' ? prof(u) : prof(easeInOut(u));
  m.mp.style.strokeDashoffset = L - len;
  // перекладина: открыта только пройденная часть
  const barDone = Math.max(0, Math.min(BAR_LEN, len - CUM[4] - 8));
  m.bar.style.strokeDasharray = `0 ${barDone} ${BAR_LEN + 1} 0`;
  m.bar.style.display = barDone >= BAR_LEN ? 'none' : '';
  m.diag.style.strokeDasharray = `${Math.min(len, SEG[0])} ${L}`;

  const p = m.mp.getPointAtLength(Math.min(len, L - .001));
  const p0 = m.mp.getPointAtLength(Math.max(0, len - 2));
  let dx = p.x - p0.x, dy = p.y - p0.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
  const tiny = m.size === 'tiny', fx = !tiny && cfg.sparks && m.size === 'big';

  if (u < 1) {
    // поджиг: точка разгорается с 0.6 масштаба, без появления «из ничего»
    const ig = cfg.ignite ? easeOut(Math.min(1, elapsed / cfg.ignite)) : 1;
    const f = cfg.sparks ? flick(elapsed) : 1;
    m.torch.setAttribute('opacity', (ig * f).toFixed(3));
    m.torch.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${(.6 + .4 * ig) * (tiny ? .8 : 1)})`);
    m.halo.setAttribute('r', (cfg.sparks ? 13 + 4 * f : 12).toFixed(2));
    m.tail.setAttribute('opacity', tiny ? 0 : 1);
    if (fx && tDraw > 0) {
      if (elapsed - m.lastSpark > 30) {
        m.lastSpark = elapsed;
        const n = Math.random() < .35 ? 2 : 1;
        for (let i = 0; i < n; i++) spark(m, p.x, p.y, dx, dy, elapsed);
      }
      while (m.corner < CORNERS.length && len >= CORNERS[m.corner]) {   // на угле — пучок искр
        for (let i = 0; i < 7; i++) spark(m, p.x, p.y, dx, dy, elapsed, 1.25);
        m.corner++;
      }
    }
  } else {
    const k = Math.min(1, (tDraw - cfg.dur) / cfg.finish);
    const out = 1 - easeOut(Math.min(1, k * 2));
    m.torch.setAttribute('opacity', out.toFixed(3));
    m.tail.setAttribute('opacity', out.toFixed(3));
    // шов замкнулся: мягкий проблеск всего знака и затухание
    const sh = Math.sin(Math.PI * Math.min(1, k)) * (tiny ? 0 : .45);
    m.sheen.setAttribute('opacity', sh.toFixed(3));
  }
  // остывание: короткий белый, средний жёлтый, длинный оранжевый
  const sc = mode === 'long' ? 1 : .6;
  tailWindow(m.t1, len, 6 * sc); tailWindow(m.t2, len, 26 * sc); tailWindow(m.t3, len, 58 * sc);
  stepSparks(m, elapsed, dt);
}

function play() {
  cancelAnimationFrame(raf);
  const cfg = MODES[mode];
  for (const m of marks) {
    m.sparks.forEach(s => s.el.remove()); m.sparks = []; m.corner = 0; m.lastSpark = 0;
    m.sheen.setAttribute('opacity', 0);
  }
  if (reduce) {
    for (const m of marks) {
      m.mp.style.strokeDashoffset = 0; m.torch.setAttribute('opacity', 0); m.tail.setAttribute('opacity', 0);
      m.mp.closest('svg').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease' });
    }
    return;
  }
  let elapsed = 0, prev = performance.now();
  const total = cfg.ignite + cfg.dur + cfg.finish;
  const frame = now => {
    // время копится с ограничением шага: в скрытой вкладке анимация встаёт на паузу, а не проскакивает
    const raw = Math.min(250, now - prev); prev = now;
    const dtms = raw / speed; elapsed += dtms;
    for (const m of marks) render(m, cfg, elapsed, dtms / 1000);
    if (elapsed < total || marks.some(m => m.sparks.length)) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

// Для проверки: прокрутить анимацию до момента ms (шагами по 16 мс) и замереть.
window.__seek = (ms, m = mode) => {
  cancelAnimationFrame(raf); mode = m;
  const cfg = MODES[mode];
  for (const k of marks) { k.sparks.forEach(s => s.el.remove()); k.sparks = []; k.corner = 0; k.lastSpark = 0; k.sheen.setAttribute('opacity', 0); }
  for (let e = 16; e <= ms; e += 16) for (const k of marks) render(k, cfg, e, .016);
  return ms;
};

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
  play();
}));
document.getElementById('replay').addEventListener('click', play);
document.getElementById('slow').addEventListener('click', e => {
  speed = speed === 1 ? 4 : 1;
  e.currentTarget.setAttribute('aria-pressed', speed !== 1);
  play();
});
document.getElementById('bg').addEventListener('click', e => {
  const dark = document.documentElement.dataset.bg !== 'dark';
  document.documentElement.dataset.bg = dark ? 'dark' : 'light';
  e.currentTarget.textContent = dark ? 'Светлый фон' : 'Тёмный фон';
});
play();
</script>
</body>
