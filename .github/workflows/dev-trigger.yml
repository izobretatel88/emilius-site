name: dev → пересобрать превью

# Пуш в ветку dev запускает общий деплой из main,
# который выкладывает её в /emilius-site/dev/.
on:
  push:
    branches: [dev]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
