name: Deploy preview to GitHub Pages

# Одна публикация — две версии сайта:
#   /emilius-site/             — ветка main (рабочее превью)
#   /emilius-site/dev/         — ветка dev (опыты), если она есть
#   /emilius-site/extra/       — ветка extra (клиентские материалы, статика как есть), если она есть
#   /emilius-site/dev-ui/      — ветка dev-ui (правки интерфейса на проверку, отдельно от dev), если она есть
#   /emilius-site/ds/          — ветка ds-v2 (развитие дизайн-системы, отдельно от dev и dev-ui), если она есть
#   /emilius-site/think/       — ветка claude/think-different (эксперимент, отдельно от dev), если она есть
# Публикует всегда main: окружение github-pages разрешает деплой только из неё.
# Пуш в dev или extra запускает этот workflow через dev-trigger.yml / extra-trigger.yml.
# После пуша в dev-ui, ds-v2 или claude/think-different запускать вручную: gh workflow run deploy.yml --ref main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - id: devbranch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: devsite

      - id: extrabranch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: extra
          path: extra

      - id: devuibranch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev-ui
          path: devuisite

      - id: dsbranch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ds-v2
          path: dssite

      - id: thinkbranch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/think-different
          path: thinksite

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка main
        working-directory: site
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Сборка dev
        if: steps.devbranch.outcome == 'success'
        working-directory: devsite
        run: npm ci && npm run build && mkdir -p ../site/dist/dev && cp -R dist/. ../site/dist/dev/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev

      - name: Сборка dev-ui
        if: steps.devuibranch.outcome == 'success'
        working-directory: devuisite
        run: npm ci && npm run build && mkdir -p ../site/dist/dev-ui && cp -R dist/. ../site/dist/dev-ui/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev-ui

      - name: Сборка ds-v2
        if: steps.dsbranch.outcome == 'success'
        working-directory: dssite
        run: npm ci && npm run build && mkdir -p ../site/dist/ds && cp -R dist/. ../site/dist/ds/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/ds

      - name: Сборка claude/think-different
        if: steps.thinkbranch.outcome == 'success'
        working-directory: thinksite
        run: npm ci && npm run build && mkdir -p ../site/dist/think && cp -R dist/. ../site/dist/think/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/think

      - name: Ветка extra (без сборки)
        if: steps.extrabranch.outcome == 'success'
        run: mkdir -p site/dist/extra && rsync -a --exclude .git extra/ site/dist/extra/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
