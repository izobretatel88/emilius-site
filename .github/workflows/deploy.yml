name: Deploy preview to GitHub Pages

# Одна публикация — две версии сайта:
#   /emilius-site/             — ветка main (рабочее превью)
#   /emilius-site/dev/         — ветка dev (опыты), если она есть
# Публикует всегда main: окружение github-pages разрешает деплой только из неё.
# Пуш в dev запускает этот workflow через dev-trigger.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - id: devbranch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: devsite

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка main
        working-directory: site
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Сборка dev
        if: steps.devbranch.outcome == 'success'
        working-directory: devsite
        run: npm ci && npm run build && mkdir -p ../site/dist/dev && cp -R dist/. ../site/dist/dev/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
