<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Графика для карточки партнёра InSales</title>
<style>
  /* Картинки для карточки Emilius в каталоге партнёров InSales.
     Макет 1200×800 (3:2 — так показывает портфолио каталога), рендер в 2× → 2400×1600.
     Логотип — 480×480 (?slide=logo). Бренд — как в avito/oblozhka/series: бирюза #00999b/#008385, графит, Glober. */
  @font-face{font-family:Glober;font-weight:400;src:url(../../avito/oblozhka/series/fonts/glober-400.woff2) format('woff2')}
  @font-face{font-family:Glober;font-weight:600;src:url(../../avito/oblozhka/series/fonts/glober-600.woff2) format('woff2')}
  @font-face{font-family:Glober;font-weight:700;src:url(../../avito/oblozhka/series/fonts/glober-700.woff2) format('woff2')}
  @font-face{font-family:Glober;font-weight:800;src:url(../../avito/oblozhka/series/fonts/glober-800.woff2) format('woff2')}
  :root{
    --teal:#00999b; --teal-btn:#008385; --teal-deep:#006e70; --teal-soft:#e3f4f4;
    --ink:#1d1d1f; --ink-2:#3a3a3c; --page:#f5f5f7; --card:#fff; --hair:#e5e5ea;
    --night:#121314; --night-2:#1c1d1f; --on-night:#f5f5f7; --on-night-2:#c7c7cc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:800px;overflow:hidden;background:var(--page)}
  body.sq,body.sq html{width:480px;height:480px}
  body{font-family:Glober,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .slide{position:absolute;inset:0;overflow:hidden}

  /* окно браузера и телефон */
  .browser{position:absolute;border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:0 40px 90px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)}
  .browser .bar{height:30px;background:#ececef;display:flex;align-items:center;gap:7px;padding:0 14px}
  .browser .bar i{width:11px;height:11px;border-radius:50%;background:#cfcfd4}
  .browser .bar i:nth-child(1){background:#ff5f57}.browser .bar i:nth-child(2){background:#febc2e}.browser .bar i:nth-child(3){background:#28c840}
  .browser img{display:block;width:100%}
  .phone{position:absolute;border-radius:34px;overflow:hidden;background:#000;padding:7px;
    box-shadow:0 30px 70px rgba(0,0,0,.4)}
  .phone img{display:block;width:100%;border-radius:28px}

  /* ---------- 1. обложка описания ---------- */
  .hero{background:radial-gradient(900px 700px at 85% 20%,rgba(0,153,155,.35),rgba(0,153,155,0) 60%),var(--night);color:var(--on-night)}
  /* итерации 7 и 28: на телефоне (×0,3) подзаголовок и плашки были ~6–8px — крупнее; подзаголовок не шире 510px, чтобы не заезжать под телефон */
  .hero .txt{position:absolute;left:64px;top:80px;width:560px}
  .hero .eyebrow{font-size:24px}
  .eyebrow{display:inline-block;font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-btn)}
  .dark .eyebrow{color:#3fc4c6}
  .hero h1{margin-top:22px;font-size:64px;line-height:1;font-weight:800;letter-spacing:-.025em}
  .hero h1 em{font-style:normal;color:#3fc4c6}
  .hero p{margin-top:26px;max-width:510px;font-size:34px;line-height:1.22;font-weight:600;color:var(--on-night-2)}
  .hero .chips{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
  .chips span{font-size:28px;font-weight:700;padding:12px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.22);color:var(--on-night)}

  /* ---------- 2. этапы ---------- */
  /* итерация 4: на телефоне картинка ~360px (×0,3) — крупные заголовки этапов в одну строку, короткие подписи */
  .steps .head{position:absolute;left:64px;top:56px;right:64px}
  .steps h2{font-size:56px}
  .steps ol{position:absolute;left:64px;right:64px;top:196px;bottom:48px;list-style:none;display:grid;grid-template-rows:repeat(5,1fr);gap:12px}
  .steps li{background:var(--card);border-radius:20px;padding:0 30px 0 112px;position:relative;display:flex;align-items:center;gap:28px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
  .steps li b{flex:0 0 400px;font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
  .steps li span{font-size:28px;line-height:1.2;color:var(--ink-2);font-weight:600}
  .steps li::before{content:attr(data-n);position:absolute;left:26px;top:50%;transform:translateY(-50%);
    width:62px;height:62px;border-radius:16px;background:var(--teal-btn);color:#fff;
    font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center}

  /* ---------- 3. тема или свой фронтенд ---------- */
  /* итерация 5: на телефоне (×0,3) пункты по 22px были ~6px — меньше пунктов, крупнее шрифт; итерация 21: внизу «Подходит, когда» 30px */
  .vs .head{position:absolute;left:64px;top:56px;right:64px}
  .vs h2{font-size:56px}
  .vs .cols{position:absolute;left:64px;right:64px;top:190px;bottom:48px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .vs .col{border-radius:26px;padding:40px 40px;display:flex;flex-direction:column}
  .vs .col.a{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
  .vs .col.b{background:var(--night);color:var(--on-night)}
  .vs .col h3{font-size:42px;font-weight:800;letter-spacing:-.015em;line-height:1.05}
  .vs .col .price{margin-top:14px;font-size:30px;font-weight:700;color:var(--teal-btn)}
  .vs .col.b .price{color:#3fc4c6}
  .vs ul{margin-top:34px;list-style:none;display:flex;flex-direction:column;gap:22px}
  .vs li{font-size:32px;line-height:1.15;font-weight:600;padding-left:44px;position:relative}
  .vs li::before{content:"";position:absolute;left:6px;top:5px;width:11px;height:20px;border:solid var(--teal-btn);border-width:0 5px 5px 0;transform:rotate(45deg)}
  .vs .col.b li::before{border-color:#3fc4c6}
  .vs .when{margin-top:auto;padding-top:22px;border-top:2px solid var(--hair);font-size:30px;line-height:1.25;font-weight:700}
  .vs .col.b .when{border-color:rgba(255,255,255,.16)}
  .vs .when b{display:block;font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;color:var(--ink-2)}
  .vs .col.b .when b{color:var(--on-night-2)}

  /* ---------- 4. что остаётся у вас ---------- */
  /* итерация 6: на телефоне (×0,3) подписи 19px были ~6px — крупнее иконки и заголовки, подписи в 2–4 слова */
  .keep .head{position:absolute;left:64px;top:56px;right:64px}
  .keep h2{font-size:56px}
  .keep .grid{position:absolute;left:64px;right:64px;top:190px;bottom:48px;grid-auto-rows:1fr;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .keep .t{background:var(--card);border-radius:24px;padding:32px 30px;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
  .keep .t i{display:flex;width:72px;height:72px;border-radius:20px;background:var(--teal-soft);align-items:center;justify-content:center}
  .keep .t i svg{width:40px;height:40px;stroke:var(--teal-btn);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .keep .t b{display:block;margin-top:auto;font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-.01em}
  .keep .t span{display:block;margin-top:10px;font-size:26px;line-height:1.2;font-weight:600;color:var(--ink-2)}

  /* ---------- 5. кейсы ---------- */
  .case{background:radial-gradient(800px 700px at 90% 100%,rgba(0,153,155,.28),rgba(0,153,155,0) 60%),var(--night);color:var(--on-night)}
  /* итерация 3: в превью портфолио (~420px) подписи не читались — текст крупнее; итерация 15: окно браузера целиком в кадре */
  .case .txt{position:absolute;left:64px;top:70px;width:470px}
  .case .eyebrow{font-size:24px}
  .case h2{margin-top:18px;font-size:84px}
  .case .what{margin-top:16px;font-size:32px;font-weight:600;line-height:1.3;color:var(--on-night-2)}
  .case .did{margin-top:30px;padding-top:26px;border-top:2px solid rgba(255,255,255,.16);font-size:30px;line-height:1.3}
  .case .did small{display:block;font-size:24px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-night-2);margin-bottom:10px}
  .case .metric{margin-top:26px;display:inline-flex;flex-direction:column;background:var(--teal-btn);border-radius:16px;padding:14px 20px 16px}
  .case .metric b{font-size:56px;font-weight:800;line-height:1}
  .case .metric span{margin-top:8px;font-size:24px;font-weight:600}
  .case .site{position:absolute;left:64px;bottom:64px;display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border:2px solid rgba(255,255,255,.22);border-radius:999px;font-size:28px;font-weight:600;color:var(--on-night)}
  .case .site i{width:12px;height:12px;border-radius:50%;background:var(--accent,#3fc4c6);box-shadow:0 0 0 5px rgba(63,196,198,.2)}

  /* ---------- логотип 480×480 ---------- */
  /* логотип: таблетка «Эмилиус [знак] Эдженси» как в Logo.astro на dev-ветке emilius-site
     (белая карточка, рамка --hair, Glober 600, знак 267×401), растянута почти на всю ширину квадрата */
  .sqlogo{width:480px;height:480px;background:#fff;display:flex;align-items:center;justify-content:center}
  .sqlogo .pill{display:inline-flex;align-items:center;gap:14px;padding:22px 24px;background:#fff;border:2px solid var(--hair);
    border-radius:24px;font-weight:600;font-size:41px;line-height:1;color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.05)}
  .sqlogo .pill img{display:block;width:46px;height:69px;flex:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
  const LOGO = '../../avito/oblozhka/series/src/logo.png';
  const shot = (id, k) => `shots/${id}-${k}.png`;
  const browser = (id, l, t, w, h) =>
    `<div class="browser" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><div class="bar"><i></i><i></i><i></i></div><img src="${shot(id,'desk')}"></div>`;
  const phone = (id, l, t, w) =>
    `<div class="phone" style="left:${l}px;top:${t}px;width:${w}px;height:${Math.round((w-14)*844/390)+14}px"><img src="${shot(id,'mob')}"></div>`;

  // тексты и адреса кейсов — из src/data/projects.ts сайта Emilius (.worktrees/emilius-site-structure)
  const CASES = {
    alohagaia: {site:'alohagaia.ru', name:'Aloha Gaia', what:'Российский бренд ювелирных украшений', did:'Фронтенд-разработка, тесная интеграция с InSales и собственные модули.'},
    duman:     {site:'duman.store', name:'Duman', what:'Дизайнерская женская одежда премиум-сегмента', did:'Фронтенд-разработка, сложная архитектура и выразительный UX/UI.'},
    limemart:  {site:'limemart.wizzu.ru', name:'LimeMart', what:'Доставка продуктов в Чечне', did:'Техническая часть стартапа: витрина и интеграции.', metric:['2000+','заказов в месяц, старт с нуля']},
    geekboards:{site:'geekboards.ru', name:'Geekboards', what:'Клавиатуры, мыши и аксессуары, шоурум в Москве', did:'Развитие магазина и кастомизация фронтенда.'},
  };

  const ICON = {
    code:'<path d="M8 6 2 12l6 6M16 6l6 6-6 6"/>',
    figma:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M9 21V9"/>',
    key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',
    blocks:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/>',
    team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    // чек: «расходы посчитаны заранее» (стопка монет читалась как иконка базы данных)
    coins:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  };
  const ic = k => `<i><svg viewBox="0 0 24 24">${ICON[k]}</svg></i>`;

  const q = new URLSearchParams(location.search);
  const s = q.get('slide') || 'hero';
  const root = document.getElementById('root');

  if (s === 'hero') {
    root.innerHTML = `<div class="slide hero dark">
      <div class="txt">
        <div class="eyebrow">Студия разработки на InSales</div>
        <h1>Магазин, который выглядит <em>как бренд</em>, а не как шаблон</h1>
        <p>Свой дизайн в Figma и тема InSales, написанная с нуля.</p>
        <div class="chips"><span>UX/UI</span><span>Figma</span><span>Liquid</span></div>
      </div>
      ${browser('duman', 640, 110, 530, 362)}
      ${phone('duman', 600, 330, 200)}
    </div>`;
  } else if (s === 'steps') {
    const st = [
      ['Аналитика','ниша, покупатели, структура'],
      ['Дизайн в Figma','макеты и дизайн-система'],
      ['Своя тема на Liquid','вёрстка с нуля, мобильная версия'],
      ['Интеграции','оплата, доставка, 1С, маркетплейсы'],
      ['Запуск и передача','тема, исходники, доступы — вам'],
    ];
    root.innerHTML = `<div class="slide steps">
      <div class="head"><div class="eyebrow">Индивидуальный фронтенд</div><h2 style="margin-top:12px">Пять этапов от брифа до запуска</h2></div>
      <ol>${st.map((x,i)=>`<li data-n="${i+1}"><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')}</ol>
    </div>`;
  } else if (s === 'vs') {
    root.innerHTML = `<div class="slide vs">
      <div class="head"><div class="eyebrow">Два формата</div><h2 style="margin-top:14px">Готовая тема или свой фронтенд</h2></div>
      <div class="cols">
        <div class="col a"><h3>Готовая тема</h3><div class="price">от 75 000 ₽ · 2–3 недели</div>
          <ul><li>Тема под ваш бренд</li><li>Каталог и фильтры</li><li>Оплата и доставка</li><li>Метрика и базовое SEO</li></ul>
          <div class="when"><b>Подходит, когда</b>важно начать продавать быстро</div></div>
        <div class="col b"><h3>Свой фронтенд</h3><div class="price">смета в часах после брифа</div>
          <ul><li>Свой дизайн в Figma</li><li>Тема с нуля на Liquid</li><li>Своя мобильная версия</li><li>Сложные интеграции</li></ul>
          <div class="when"><b>Подходит, когда</b>нужен свой узнаваемый стиль</div></div>
      </div>
    </div>`;
  } else if (s === 'keep') {
    const t = [
      ['code','Своя тема InSales','код темы — ваш'],
      ['figma','Макеты в Figma','исходники и&nbsp;дизайн‑система'],
      ['key','Всё на вас','домен, аккаунт, сервисы'],
      ['blocks','Блоки в админке','без программиста'],
      ['team','Обученная команда','каталог, цены, заказы'],
      ['coins','Понятные расходы','посчитаны заранее'],
    ];
    root.innerHTML = `<div class="slide keep">
      <div class="head"><div class="eyebrow">После запуска</div><h2 style="margin-top:14px">Что остаётся у вас</h2></div>
      <div class="grid">${t.map(x=>`<div class="t">${ic(x[0])}<b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
    </div>`;
  } else if (s.startsWith('case-')) {
    const id = s.slice(5), c = CASES[id];
    root.innerHTML = `<div class="slide case dark">
      <div class="txt">
        <div class="eyebrow">Наш проект на InSales</div>
        <h2>${c.name}</h2>
        <div class="what">${c.what}</div>
        <div class="did"><small>Что сделали</small>${c.did}</div>
        ${c.metric ? `<div class="metric"><b>${c.metric[0]}</b><span>${c.metric[1]}</span></div>` : ''}
      </div>
      <div class="site"><i></i>${c.site}</div>
      ${browser(id, 610, 150, 560, 380)}
      ${phone(id, 560, 360, 200)}
    </div>`;
  } else if (s === 'logo') {
    document.body.className = 'sq';
    root.innerHTML = `<div class="sqlogo"><div class="pill"><span>Эмилиус</span><img src="${LOGO}" alt=""><span>Эдженси</span></div></div>`;
  }
</script>
</body>
</html>
